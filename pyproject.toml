[project]
name = "ne-edoc"
version = "0.2.0"
description = "NE능률 그룹웨어 전자결재·전자문서를 Claude가 조회하도록 하는 MCP 서버 (조회 전용)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.scripts]
ne-edoc = "ne_edoc.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ne_edoc"]
